name: Build Keylogger (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CMakeLists.txt exists
        shell: pwsh
        run: |
          if (-not (Test-Path "CMakeLists.txt")) {
            throw "CMakeLists.txt is missing in the repository root!"
          }
          Write-Host "CMakeLists.txt found."

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload keylogger executable
        uses: actions/upload-artifact@v4
        with:
          name: keylogger-windows
          path: build/Release/keylogger.exe
