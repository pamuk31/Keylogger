name: Build Keylogger (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List root files for debugging
        shell: pwsh
        run: Get-ChildItem -Path . -Name

      - name: Ensure CMakeLists.txt exists
        shell: pwsh
        run: |
          if (-not (Test-Path "CMakeLists.txt")) {
            Write-Host "CMakeLists.txt not found; downloading from original repository"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/GiacomoLaw/Keylogger/master/CMakeLists.txt" -OutFile "CMakeLists.txt"
          } else {
            Write-Host "CMakeLists.txt found locally"
          }

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload keylogger executable
        uses: actions/upload-artifact@v4
        with:
          name: keylogger-windows
          path: build/Release/keylogger.exe
