name: Build Keylogger (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Release
        run: cmake --build build --config Release

      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination "build\Release\"
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination "build\Release\"

      - name: Upload artifact (exe + DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: keylogger-windows
          path: build/Release/
